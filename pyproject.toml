[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "phylo3d-trait"
version = "0.1.0"
description = "Universal interactive 3D phylogenetic tree tool with continuous trait evolution"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Phylo3D Authors" }
]
dependencies = [
    "biopython>=1.79",
    "plotly>=5.0.0",
    "pandas>=1.3.0",
    "numpy>=1.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
phylo3d-trait = "phylo3d_trait.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["phylo3d_trait*"]
