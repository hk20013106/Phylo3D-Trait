[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "phylo3d-trait"
version = "0.3.0"
description = "Interactive 3D phylogenetic visualization of continuous trait evolution and supplied ancestral-state estimates"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Kai He" }
]
keywords = [
    "phylogenetics",
    "phylogeny",
    "trait evolution",
    "macroevolution",
    "ancestral states",
    "comparative biology",
    "3D visualization",
    "scientific visualization",
    "WebGL2",
    "Newick",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "biopython>=1.79",
    "plotly>=5.0.0",
    "pandas>=1.3.0",
    "numpy>=1.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
phylo3d-trait = "phylo3d_trait.cli:main"

[project.urls]
Homepage = "https://github.com/hk20013106/Phylo3D-Trait"
Documentation = "https://github.com/hk20013106/Phylo3D-Trait/blob/main/docs/PHYLO3D_TRAIT_USAGE_GUIDE.md"
Repository = "https://github.com/hk20013106/Phylo3D-Trait"
Issues = "https://github.com/hk20013106/Phylo3D-Trait/issues"
Changelog = "https://github.com/hk20013106/Phylo3D-Trait/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["phylo3d_trait*"]
