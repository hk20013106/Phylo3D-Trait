name: Feature request
description: Propose a scientific visualization, workflow, or usability improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Describe the scientific/workflow problem before proposing an implementation.
    validations:
      required: true
  - type: textarea
    id: desired
    attributes:
      label: Desired behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Existing alternatives or workarounds
      description: Include related tools or existing Phylo3D-Trait options if known.
    validations:
      required: false
  - type: textarea
    id: data
    attributes:
      label: Example data or figure
      description: Optional minimal public/non-sensitive example.
    validations:
      required: false
