name: Verify PyPI v0.3.1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-pypi-v0.3.1.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install from public PyPI and smoke test
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir "phylo3d-trait==0.3.1"
          python -c "import phylo3d_trait; assert phylo3d_trait.__version__ == '0.3.1'; print('VERSION=' + phylo3d_trait.__version__)"
          phylo3d-trait --help
