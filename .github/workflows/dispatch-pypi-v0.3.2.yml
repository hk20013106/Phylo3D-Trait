name: Dispatch PyPI v0.3.2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dispatch-pypi-v0.3.2.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch trusted PyPI workflow at v0.3.2
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run publish-pypi.yml --ref v0.3.2
