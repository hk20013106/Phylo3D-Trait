name: Bootstrap v0.3.0 release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-release-v0.3.0.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create release if absent
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view v0.3.0 >/dev/null 2>&1; then
            echo "v0.3.0 release already exists"
            exit 0
          fi
          cat > /tmp/release-notes.md <<'EOF'
          ## Phylo3D-Trait v0.3.0

          This release introduces the Four-Layer native WebGL2 renderer for publication-oriented interactive 3D visualization of continuous trait evolution on phylogenetic trees.

          ### Highlights
          - Fixed four-layer fragment depth peeling for order-independent transparency of retained layers.
          - Adaptive front-facing scientific axes and camera-aware outward terminal labels.
          - Interactive picking for terminal and ancestral internal nodes.
          - PNG and hybrid SVG export.
          - Stable deterministic clade identifiers for mapping supplied ancestral-state estimates.
          - Plotly renderer retained for legacy/general exploration workflows.

          ### Scientific scope
          Phylo3D-Trait visualizes supplied node values. It does not infer phylogenies, date trees, or perform ancestral-state reconstruction.

          See the README and User & AI Agent Guide for installation and reproducible workflows.
          EOF
          gh release create v0.3.0 --verify-tag --title "Phylo3D-Trait v0.3.0" --notes-file /tmp/release-notes.md
